name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Hosted setup bundle is regenerated from the migrations
        run: |
          bash scripts/gen-hosted-setup.sh
          git diff --exit-code deploy/hosted-setup.sql

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply auth shim (Supabase stand-in for plain Postgres)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/supabase-shim.sql

      - name: Apply migrations from zero
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed (idempotency proven by running twice)
        run: |
          pnpm seed
          pnpm seed

      - name: Admin apply/reject smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/admin-smoke.sql

      - name: Generated types are current
        run: |
          pnpm db:types
          git diff --exit-code src/types/database.ts
